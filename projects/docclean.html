    <section class="section" aria-labelledby="problem-title">
      <h2 id="problem-title">The problem</h2>
      <div class="section-body prose">
        <p>Every month, the company has to file Maryland Motor Fuel Tax returns on forms 768 and 769. The numbers come from reports sent by distributors, and turning those reports into finished filings was done by hand. It took several days each month.</p>
        <p>Speed wasn't the only concern. These are tax filings, so any shortcut had to be at least as accurate as doing it by hand.</p>
      </div>
    </section>

    <section class="section" aria-labelledby="did-title">
      <h2 id="did-title">What I did</h2>
      <div class="section-body prose">
        <ul>
          <li>Gathered requirements with my colleague: what the distributor reports contain, what each form needs, and where the manual process slowed down.</li>
          <li>Built DocClean with Claude Code to read the monthly reports and produce the 768 and 769 filings.</li>
          <li>Designed a human review step. Before anything is filed, a person checks DocClean's output against the original source reports.</li>
        </ul>
        <!-- Add more detail here: how the app works, a screenshot, problems you ran into and how you solved them. -->
      </div>
    </section>

    <section class="section" aria-labelledby="result-title">
      <h2 id="result-title">The result</h2>
      <div class="section-body prose">
        <p>Monthly filing prep went from several days to under two hours. The review step keeps a person responsible for every number that goes to the state.</p>
